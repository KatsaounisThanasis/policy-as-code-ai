name: Policy-as-Code CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install OPA
        run: |
          curl -sSL -o opa https://openpolicyagent.org/downloads/latest/opa_linux_amd64_static
          chmod +x opa
          sudo mv opa /usr/local/bin/opa
      - name: Run OPA tests
        run: opa test policies/ -v
      - name: Run pytest
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          python -m pytest tests/ -q

  policy-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
          curl -sSL -o opa https://openpolicyagent.org/downloads/latest/opa_linux_amd64_static
          chmod +x opa
          sudo mv opa /usr/local/bin/opa
      - name: Evaluate policy
        run: opa eval --format=json -i examples/insecure_plan.json -d policies/enforce_security.rego 'data.terraform.security.deny' > violations.json
      - name: Convert to SARIF
        run: python3 scripts/opa_to_sarif.py --input violations.json --output policy.sarif
      - name: Upload SARIF to the Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: policy.sarif
      - name: Post PR report
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- pac-ai-report -->';
            const raw = JSON.parse(fs.readFileSync('violations.json', 'utf8'));
            const violations = (((raw.result || [])[0] || {}).expressions || [])[0]?.value || [];
            const fixes = {
              "AZ-STORAGE-001": "allow_nested_items_to_be_public = false",
              "AZ-STORAGE-002": "shared_access_key_enabled = false",
              "AZ-STORAGE-003": "public_network_access_enabled = false",
              "AZ-STORAGE-004": "min_tls_version = \"TLS1_2\"",
              "AZ-STORAGE-005": "https_traffic_only_enabled = true"
            };
            const esc = (val) => String(val ?? '').replace(/\|/g, '\\|').replace(/\r?\n/g, ' ');
            let rows;
            if (violations.length === 0) {
              rows = '| _none_ | _n/a_ | _n/a_ | No violations found |';
            } else {
              rows = violations
                .map(v => `| ${esc(v.rule)} | ${esc(v.severity)} | ${esc(v.resource)} | ${esc(v.message)} |`)
                .join('\n');
            }
            const table = ['| rule | severity | resource | message |', '| --- | --- | --- | --- |', rows].join('\n');
            const fixLines = Object.entries(fixes)
              .map(([rule, fix]) => `- **${rule}**: \`${fix}\``)
              .join('\n');
            const body = [
              marker,
              '## Policy-as-Code Scan Report',
              '',
              `Found **${violations.length}** policy violation(s) in the Terraform plan.`,
              '',
              table,
              '',
              '### Suggested deterministic fix',
              fixLines,
              '',
              '_Local-first: the AI risk explanations run on your machine via `make explain`; this CI stays cloud- and LLM-free._'
            ].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number, per_page: 100
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
